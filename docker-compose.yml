# 私有化交付的编排：一台装了 docker 的机器，填好 .env（或显式导出环境变量），`make up` 起全套。
#
# 这一份里没有任何凭据：需要值的地方一律 ${VAR}，必填的用 :?——没给时 compose 直接拒绝启动
# 并点名缺哪个变量，而不是等应用连不上库再猜。形状见 config.yaml，展开规则见 common/config/app_config.go。
services:
  webapp:
    build:
      context: ./
      dockerfile: Dockerfile
    image: thooh:1.0.0
    container_name: thooh-go
    restart: unless-stopped
    ports:
      # 容器内端口固定 8080（config.yaml 的 server.port 用默认值，不给 THOOH_SERVER_PORT）；
      # 这个变量只决定宿主机暴露哪个端口。两个含义塞进一个变量就会互相打脸。
      - "${THOOH_PUBLIC_PORT:-8080}:8080"
    environment:
      THOOH_DB_HOST: ${THOOH_DB_HOST:-mysql}
      THOOH_DB_PORT: ${THOOH_DB_PORT:-3306}
      THOOH_DB_NAME: ${THOOH_DB_NAME:-thooh-go}
      THOOH_DB_USER: ${THOOH_DB_USER:-root}
      THOOH_DB_PW: ${THOOH_DB_PW:?必填：MySQL 口令，与 mysql 服务同一个值（生成：openssl rand -base64 24）}
      THOOH_REDIS_HOST: ${THOOH_REDIS_HOST:-redis}
      THOOH_REDIS_PORT: ${THOOH_REDIS_PORT:-6379}
      THOOH_REDIS_PW: ${THOOH_REDIS_PW:-}
      THOOH_JWT_SECRET: ${THOOH_JWT_SECRET:?必填：签名密钥，生成：openssl rand -base64 48；换了它现存 token 全部失效}
      # 交付默认 release：debug 模式会把路由与请求细节全打在日志里
      THOOH_RUN_MODE: ${THOOH_RUN_MODE:-release}
      THOOH_LOG_LEVEL: ${THOOH_LOG_LEVEL:-info}
    volumes:
      # 配置只写形状，所以可以入库、可以只读挂进容器；镜像里没有 config.yaml
      - ./config.yaml:/data/app/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${THOOH_DB_PW:?必填：与 webapp 的 THOOH_DB_PW 同一个值}
      MYSQL_DATABASE: ${THOOH_DB_NAME:-thooh-go}
    volumes:
      # dump 只在数据目录为空时被执行（镜像的 initdb 机制）：改了 thooh-go.sql 要
      # `docker compose down -v` 清卷才会重建——留着旧卷对不上账，别看错了列名漂移。
      - ./thooh-go.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - thooh-mysql:/var/lib/mysql
    healthcheck:
      # $$ 是不让 compose 插值：口令由容器自己的环境变量给。写进 test 字符串里等于
      # 在 `docker inspect` 上留一份明文副本。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s
    # 不写 ports：mysql 与 redis 只在 compose 内部网络里可达，不对业务网暴露

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  thooh-mysql:
    name: thooh-mysql
