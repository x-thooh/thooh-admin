# 这份文件只写「形状」，不写值：凭据一律用 ${VAR} 从环境注入，没给就起不来并点名缺哪个。
# 允许留默认的只有 host/port/dbname 这类环境坐标。语法：${NAME} 必填，${NAME:-默认} 可空。
server:
  port: ${THOOH_SERVER_PORT:-8080}
  runMode: ${THOOH_RUN_MODE:-debug} # release debug；交付给客户要显式给 release
  logLevel: ${THOOH_LOG_LEVEL:-debug} # debug info warn error
  enabledSwagger: false # 是否开启swagger
  openapiPath: "/swagger/doc.json"
  swaggerPath: "/swagger/index.html"

database:
  primary:
    type: mysql
    host: ${THOOH_DB_HOST:-127.0.0.1}
    port: ${THOOH_DB_PORT:-3306}
    username: ${THOOH_DB_USER:-root}
    password: ${THOOH_DB_PW}
    dbname: ${THOOH_DB_NAME:-thooh-go}
  secondary:
    enabled: ${THOOH_DB2_ENABLED:-false}
    type: mysql
    host: ${THOOH_DB2_HOST:-localhost}
    port: ${THOOH_DB2_PORT:-3306}
    username: ${THOOH_DB2_USER:-root}
    password: ${THOOH_DB2_PW:-}
    dbname: ${THOOH_DB2_NAME:-thooh-go2}
  max_idle_conn: 10
  max_open_conn: 30
  conn_max_lifetime: 300

redis:
  host: ${THOOH_REDIS_HOST:-127.0.0.1}
  port: ${THOOH_REDIS_PORT:-6379}
  password: ${THOOH_REDIS_PW:-}
  db: ${THOOH_REDIS_DB:-0}

jwt:
  secret: ${THOOH_JWT_SECRET}
  jwt_ttl: ${THOOH_JWT_TTL:-43200} # 12 * 60 * 60 秒过期

xxl-job:
  enabled: false
  env: dev
  admin_address: http://localhost:9100/xxl-job-admin
  access_token: ${THOOH_XXL_TOKEN:-}
  app_name: xxl-job-executor
  job_uname: ${THOOH_XXL_USER:-}
  job_upass: ${THOOH_XXL_PW:-}
  address:
  ip:
  port: 9102
  log_path: /home/xxl-job/log
  log_retention_days: 7 # 需要大于3
  http_timeout: 5

log:
  enabled: true    # 是开启
  logMode: ${THOOH_LOG_MODE:-default} # default mysql file es
  filePath: ${THOOH_LOG_PATH:-./log} # 日志本地时存放地址
  filterate:   # 日志过滤的接口
    - '/reg'

user-password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10
